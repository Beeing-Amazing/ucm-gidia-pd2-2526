[project]
name = "museekar"
version = "0.1.0"
description = "NYC Traffic app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.0.0",
    "findspark>=2.0.1",
    "ipykernel>=7.1.0",
    "minio>=7.2.20",
    "nbformat>=5.10.4",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "polars>=1.37.1",
    "pyarrow>=23.0.0",
    "pyspark>=4.1.1",
    "scipy>=1.17.0",
    "tensorflow>=2.21.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
graphics = [
    "geopandas>=1.1.2",
    "hdbscan>=0.8.41",
    "nbformat>=5.10.4",
    "sentence-transformers>=5.2.2",
    "shapely>=2.1.2",
]
download = [
    "geopandas>=1.1.2",
    "httpx>=0.28.0",
    "openmeteo-requests>=1.7.5",
    "openpyxl>=3.1.0",
    "prompt-toolkit>=3.0.52",
    "requests>=2.33.1",
    "requests-cache>=1.3.0",
    "retry-requests>=2.0.0",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
]
rolly = [
    "langchain-core>=0.3.0",
    "langchain-openai>=1.2.1"
]

[tool.uv.workspace]
members = [
    "backend",
    "scripts",
]
